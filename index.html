<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hueco Mundo</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="img/icon-192.png">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>

<body>
    <canvas id="stars"></canvas>

    <section class="moon-view">

        <div class="app">
            <h1>Hueco Mundo</h1>
            <canvas id="moonCanvas" width="300" height="300"></canvas>
            <div id="moonInfo" class="moon-info">
                <p id="illumText"></p>
                <p id="nameText"></p>
                <p id="ageText"></p>
                <p id="nextFullText"></p>
                <p id="nextNewText"></p>
            </div>
        </div>
    </section>
    <section class="ground">
        <nav class="menu">
            <button class="menu-item">Hadith</button>
            <button class="menu-item" id="openTodo">Todo</button>
            <button class="menu-item">Focus Timer</button>
            <button class="menu-item" id="openBooks">Books</button>
            <button class="menu-item" id="openManga">Manga</button>
        </nav>
    </section>
    <nav class="tab-bar">
        <button class="tab-item">Home</button>
        <button class="tab-item">Favorites</button>
        <button class="tab-item">Profile</button>
        <button class="tab-item">Settings</button>
    </nav>
    <section id="todoView" class="todo-view">
        <button id="closeTodo" class="close-btn">X</button>
        <h2>Todo List</h2>

        <form id="todoForm">
            <input type="text" id="todoInput" placeholder="Add a task..." autocomplete="off">
            <button type="submit">Add</button>
        </form>
        <ul id="todoList"></ul>
    </section>

    <section id="booksView" class="todo-view">
        <button id="closeBooks" class="close-btn">X</button>
        <h2>Books</h2>

        <form id="bookForm">
            <input type="text" id="bookTitle" placeholder="Title" autocomplete="off">
            <input type="text" id="bookAuthor" placeholder="Author" autocomplete="off">
            <textarea id="bookQuote" placeholder="Favorite quote (optional)" rows="2"></textarea>

            <div id="starPicker" class="star-picker">
                <span class="star" data-value="1">★</span>
                <span class="star" data-value="2">★</span>
                <span class="star" data-value="3">★</span>
                <span class="star" data-value="4">★</span>
                <span class="star" data-value="5">★</span>
            </div>

            <button type="submit">Add Book</button>
        </form>

        <ul id="bookList"></ul>
    </section>

    <section id="mangaView" class="todo-view">
        <button id="closeManga" class="close-btn">X</button>
        <h2>Manga Reader</h2>

        <input type="file" id="mangaInput" accept="application/pdf,image/*" multiple>

        <div id="mangaPage">
            <canvas id="mangaCanvas"></canvas>
            <img id="mangaImage" src="" alt="Manga Page" style="display:none;">
        </div>
        <div class="manga-controls">
            <button id="prevPage">◀ Prev</button>
            <span id="pageCounter">0 / 0</span>
            <button id="nextPage">Next ▶</button>
        </div>
    </section>

    <script src="app.js"></script>
</body>

</html>
