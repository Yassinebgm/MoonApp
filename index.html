<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hueco Mundo</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="img/icon-192.png">
</head>

<body>
    <canvas id="stars"></canvas>

    <section class="moon-view">

        <div class="app">
            <h1>Hueco Mundo</h1>
            <canvas id="moonCanvas" width="300" height="300"></canvas>
            <div id="moonInfo" class="moon-info">
                <p id="illumText"></p>
                <p id="nameText"></p>
                <p id="ageText"></p>
                <p id="nextFullText"></p>
                <p id="nextNewText"></p>
            </div>
        </div>
    </section>
    <section class="ground">
        <nav class="menu">
            <button class="menu-item">Hadith</button>
            <button class="menu-item" id="openTodo">Todo</button>
            <button class="menu-item">Focus Timer</button>
            <button class="menu-item">Coming Soon</button>
        </nav>
    </section>
    <nav class="tab-bar">
        <button class="tab-item">Home</button>
        <button class="tab-item">Favorites</button>
        <button class="tab-item">Profile</button>
        <button class="tab-item">Settings</button>
    </nav>
    <section id="todoView" class="todo-view">
        <button id="closeTodo" class="close-btn">X</button>
        <h2>Todo List</h2>

        <form id="todoForm">
            <input type="text" id="todoInput" placeholder="Add a task..." autocomplete="off">
            <button type="submit">Add</button>
        </form>
    </section>
    <ul id="todoList"></ul>

    <script src="app.js"></script>
</body>

</html>
